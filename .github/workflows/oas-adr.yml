name: OAS ADR validation

on:
  pull_request:
    paths:
      - "api/openapi.json"
      - ".github/workflows/oas-adr.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22

      - name: Update npm
        run: npm install --global npm@11.12.1

      - name: Install DON Checker
        run: npm install --global @developer-overheid-nl/don-checker@1.3.1

      - name: Validate OpenAPI against DON ADR
        run: |
          don-checker validate \
            --standard adr \
            --version 2.2.0 \
            --input api/openapi.json \
            --format table \
            --fail-on error
