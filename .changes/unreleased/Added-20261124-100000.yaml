kind: Added
body: 'Het organisatiefilter in `GET /v1/apis/filters` is nu een `search-single-select` met `showTop: 10`: de frontend toont de 10 organisaties met de meeste API''s, met een zoekveld voor de rest. De OAS beschrijft de types `search-single-select` en `search-multi-select` en `showTop` (ADR-score blijft 100).'
time: 2026-11-24T10:00:00.000000+01:00
